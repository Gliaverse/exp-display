<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maple EXP Tracker - Compact</title>
<style>:root{color-scheme:dark}body{margin:0;background:#171717;color:#eee;font-family:system-ui,sans-serif;font-variant-numeric:tabular-nums;min-width:330px}.wrap{padding:14px 16px}.head{display:flex;justify-content:space-between;gap:18px;padding-bottom:9px;margin-bottom:5px;border-bottom:1px solid #3a3a3a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}.m{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #303030}.label{color:#bbb}.value{font-weight:650;white-space:nowrap}.status{color:#aaa;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:250px}.session{white-space:nowrap;font-size:.9rem}</style></head>
<body><div class="wrap"><div class="head"><span id="status" class="status">Waiting for main tracker…</span><span class="session">Session&nbsp; <strong id="session">--</strong></span></div><div class="grid"><div class="m"><span class="label">Level</span><span id="level" class="value">--</span></div><div class="m"><span class="label">EXP</span><span id="exp" class="value">--</span></div><div class="m"><span class="label">EXP/hr</span><span id="exphr" class="value">--</span></div><div class="m"><span class="label">%/hr</span><span id="pcthr" class="value">--</span></div><div class="m"><span class="label">Level in</span><span id="eta" class="value">--</span></div><div class="m"><span class="label">%/min</span><span id="pctmin" class="value">--</span></div></div></div>
<script>const ch=new BroadcastChannel('maple-exp-tracker-state');const ids=['status','session','level','exp','exphr','pcthr','eta','pctmin'];ch.onmessage=e=>{if(!e.data||e.data.type!=='state')return;for(const id of ids){const el=document.getElementById(id);if(el&&e.data[id]!=null)el.textContent=e.data[id]}};ch.postMessage({type:'request-state'});window.addEventListener('beforeunload',()=>ch.close());</script></body></html>
